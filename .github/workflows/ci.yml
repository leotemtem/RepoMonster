name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen --extra db --extra web

      - name: Run service-free unit tests
        env:
          PYTHONPATH: src
        run: uv run --frozen python -m unittest discover -s tests

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen --extra db --extra web

      - name: Run service-free integration tests
        run: uv run --frozen python -m unittest discover -s tests_integration

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen --extra db --extra web --extra dev

      - name: Run lint checks
        run: |
          uv run --frozen ruff format --check .
          uv run --frozen ruff check .
          uv run --frozen mypy src

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen --extra dev

      - name: Run Bandit
        run: uv run --frozen bandit -q -r src

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build image
        run: docker build --tag repomonster:ci .

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: uv.lock

      - name: Install dependencies
        run: |
          python -m pip install uv==0.11.28
          uv sync --frozen --extra db --extra web

      - name: Run end-to-end tests
        run: uv run --frozen python -m unittest discover -s tests_e2e
