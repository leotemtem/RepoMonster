name: Feature request
description: Suggest an enhancement for RepoMonster
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please review the documented project boundaries in the README before
        proposing a feature. RepoMonster deliberately does not approve or merge
        code, execute repository code, or claim production GitLab support.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundary check
      options:
        - label: This request is consistent with the boundaries documented in the README.
          required: true
