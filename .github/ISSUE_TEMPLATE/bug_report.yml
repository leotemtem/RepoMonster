name: Bug report
description: Report a defect in RepoMonster
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include secrets, tokens, or
        private repository content. For security vulnerabilities, use private
        reporting instead (see SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps that trigger the behavior.
      placeholder: |
        1. Configure ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include relevant logs or error output (redact secrets).
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      description: Which entry point is affected?
      options:
        - GitHub App (webhook/worker)
        - Direct HTTP API (POST /review)
        - Local CLI (review-gate)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: RepoMonster version, tag, or commit SHA.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, deployment method (Docker Compose, etc.), OS.
    validations:
      required: false
