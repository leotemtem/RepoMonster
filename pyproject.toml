[project]
name = "repomonster"
version = "0.1.0"
description = "RAG-backed gatekeeper for GitHub pull requests and GitLab merge requests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
db = [
  "psycopg[binary]>=3.2,<4.0",
]
web = [
  "fastapi>=0.115,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.scripts]
repomonster = "review_gatekeeper.management:main"
review-gate = "review_gatekeeper.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
