[project]
name = "repomonster"
version = "0.1.0"
description = "Self-hosted RAG-backed readiness gate for GitHub pull requests"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0,<7.0",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
db = [
  "psycopg[binary]>=3.2,<4.0",
]
web = [
  "fastapi>=0.115,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "uvicorn>=0.30,<1.0",
]
dev = [
  "ruff==0.17.3",
  "mypy==2.4.1",
  "types-PyYAML==6.0.12.20261103",
  "bandit[toml]==1.9.4",
]

[project.scripts]
repomonster = "review_gatekeeper.management:main"
review-gate = "review_gatekeeper.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
