services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repomonster}
      POSTGRES_USER: ${POSTGRES_USER:-repomonster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - repomonster-data:/var/lib/postgresql/data
    restart: unless-stopped

  bootstrap:
    build: .
    command: ["repomonster", "bootstrap"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-repomonster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-repomonster}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-repomonster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-repomonster}
    networks:
      default:
      shared:
        aliases:
          - repomonster-api
    ports:
      - "127.0.0.1:${REPOMONSTER_PORT:-8000}:8000"
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    command: ["repomonster", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-repomonster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-repomonster}
    volumes:
      - /opt/repomonster/secrets/github-app.pem:/run/secrets/github_app_key:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    stop_grace_period: 3m
    restart: unless-stopped

networks:
  shared:
    external: true

volumes:
  repomonster-data:
